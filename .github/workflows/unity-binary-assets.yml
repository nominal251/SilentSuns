name: Check Unity binary assets

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python Tools/check_unity_binary_assets.py
